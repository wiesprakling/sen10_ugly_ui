name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Fix ESLint permission
        run: chmod +x ./node_modules/.bin/eslint

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test
